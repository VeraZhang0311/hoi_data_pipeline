[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi-data-pipeline"
version = "0.1.0"
description = "Versioned geometric expected-contact labels for G1 HOI references"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "trimesh>=4", "rtree>=1.2", "python-fcl>=0.7", "usd-core>=25", "pyarrow>=15"]

[project.optional-dependencies]
ultra = ["torch>=2.6"]

[project.scripts]
hoi-label = "hoi_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["hoi_pipeline*"]

